[package]
name = "picturama"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "Picturama"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono             = "0.4"
dirs               = "5"
# Used only by the photo export `withMetadata` option to copy the master JPEG's EXIF into the export.
img-parts          = "0.4"
imagesize          = "0.13"
indexmap           = { version = "2", features = ["serde"] }
kamadak-exif       = "0.6"
# libheif-rs 0.20 is the newest release that still binds libheif-sys ^1.14 (libheif ~1.14/1.15) while
# exposing the modern `LibHeif` API. libheif-sys is pinned to 1.14.4 so it links against the system
# libheif 1.15.x rather than resolving up to the 1.16-targeted bindings. Bump both once target
# platforms are confirmed on a newer libheif
libheif-rs         = "0.20"
libheif-sys        = "=1.14.4"
log                = "0.4"
once_cell          = "1"
open               = "5"
roxmltree          = "0.20"
rusqlite           = { version = "0.31", features = ["bundled"] }
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1"
serde_yaml         = "0.9"
sys-locale         = "0.3"
tauri              = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log   = "2"
tauri-plugin-shell = "2"
tokio              = { version = "1", features = ["full"] }
trash              = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
